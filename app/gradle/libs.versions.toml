# Version Catalog — 全部依赖版本的唯一来源。
# 所有版本号经官方元数据（Google Maven / Maven Central）核对为 2026-10-20 的最新稳定版
# （排除 alpha/beta/rc；AGP 9.5.0 仍仅 alpha，故停留在最新稳定 9.4.1）。
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

minSdk = "29"
compileSdk = "37"
targetSdk = "36"
# 升级到 37 会引入 Android 17 行为变更；当前 Play 强制要求为 36，故刻意滞后。
jvmTarget = "17"

composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
work = "2.12.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
datastore = "1.2.1"
serialization = "1.12.0"
okhttp = "5.5.0"

junit = "4.13.2"
androidxJunit = "1.3.0"
coroutinesTest = "1.11.0"

[libraries]
# 供 root build.gradle.kts 的 buildscript 使用：AGP 9 内置 Kotlin 默认带 KGP 2.2.10 / KSP 2.2.10-2.0.2，
# 显式声明才能升到 2.4.10 / 2.3.11。
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Compose 各模块版本由 BOM 统一管理，此处不写版本号。
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 别名不能含 "class"（Gradle 保留字），故写作 windowsize
compose-material3-windowsize = { group = "androidx.compose.material3", name = "material3-window-size-class" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9.0 起内置 Kotlin，不再需要 org.jetbrains.kotlin.android（写了会报
# "Cannot add extension with name 'kotlin'"）。以下两个 Kotlin 子插件仍需显式声明。
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
